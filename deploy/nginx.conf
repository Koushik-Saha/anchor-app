# Anchor static site. Cache policy:
#   /assets/*, /workbox-*.js   content-hashed → cache for a year, immutable
#   *.html, /sw.js, manifest   always revalidate (no-cache) so updates reach people
#   icons                      1 day
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Privacy: Anchor promises no tracking, so this server keeps no access logs.
    access_log off;
    error_log /dev/stderr warn;
    server_tokens off;
    charset utf-8;
    charset_types text/css application/javascript application/manifest+json image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

    # Container health check for Coolify.
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build output: safe to cache forever.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ~ ^/workbox-[A-Za-z0-9_-]+\.js$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Must always be revalidated, or people get stuck on an old version.
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        default_type application/manifest+json;
        types { }
        try_files $uri =404;
    }
    location ~ \.html$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Icons and other un-hashed static files.
    location ~* \.(?:png|svg|ico)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Everything else (/, /?action=start, unknown paths) → the app shell.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
