# Included in every location: nginx drops server-level add_header lines as soon as a
# location adds its own, so the security headers live here and are included everywhere.

# HTTPS only (Coolify's proxy terminates TLS). No "preload" — that's a separate, sticky decision.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# The app makes no network requests and loads nothing from other origins (CLAUDE.md rules 1–2);
# the browser enforces that too. 'unsafe-inline' styles: privacy.html's <style> block only.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Deny powerful features Anchor never uses. Screen Wake Lock stays allowed (default 'self').
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), browsing-topics=()" always;
